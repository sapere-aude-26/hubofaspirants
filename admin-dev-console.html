<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOA Developer Console</title><style>body{margin:0;background:#080d18;color:#e8eef9;font:14px system-ui}*{box-sizing:border-box}.top{height:60px;background:#0d1526;border-bottom:1px solid #26344d;display:flex;align-items:center;padding:0 18px;gap:12px}.brand{font-weight:800}.who{margin-left:auto;color:#91a0b8}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}aside{padding:14px;background:#0b1220;border-right:1px solid #26344d}button,input,textarea{background:#0b1322;color:#e8eef9;border:1px solid #2a3854;border-radius:8px;padding:9px}button{cursor:pointer;text-align:left;width:100%}.nav{display:grid;gap:6px}.sec{color:#73829e;font-size:10px;text-transform:uppercase;margin:15px 4px 7px}.main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}.panel{background:#0e1728;border:1px solid #26344d;border-radius:10px;overflow:hidden}.panel h3{margin:0;padding:11px;border-bottom:1px solid #26344d;font-size:13px}.files{max-height:650px;overflow:auto}.file{padding:9px 11px;border-bottom:1px solid #19253a;cursor:pointer}.file small{float:right;color:#657691}.editor{width:100%;height:650px;border:0;border-radius:0;font:13px Consolas,monospace}.out{padding:12px;white-space:pre-wrap;max-height:420px;overflow:auto;font:12px Consolas,monospace}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.login{max-width:420px;margin:12vh auto;padding:22px;background:#0e1728;border:1px solid #26344d;border-radius:14px}.login input{width:100%;margin:7px 0}.hide{display:none}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:#0e1728;border:1px solid #26344d;border-radius:10px;padding:11px}.ok{color:#48d3a0}.bad{color:#ff7180}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="login" class="login"><h2>HOA Developer Console</h2><p>Secure GitHub + Supabase administration.</p><input id="email" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="loginMsg"></p></div>
<div id="app" class="hide"><div class="top"><b class="brand">HUB OF ASPIRANTS · DEV CONSOLE</b><span id="who" class="who"></span><button id="logout" style="width:auto">Logout</button></div><div class="layout"><aside><div class="sec">System</div><div class="nav"><button data-a="status">Connection Status</button><button data-a="health">Supabase Health</button><button data-a="admins">Admin Accounts</button></div><div class="sec">GitHub</div><div class="nav"><button data-a="list">Repository Files</button><button data-a="commits">Recent Commits</button><button data-a="pages">GitHub Pages</button><button data-a="runs">Deployments</button></div><div class="sec">Editor</div><div class="nav"><button id="new">New / Clear</button><button id="save">Save & Commit</button></div></aside><main class="main"><div class="status"><div class="stat">Auth<br><b id="sa">Checking</b></div><div class="stat">Admin<br><b id="sd">Checking</b></div><div class="stat">Supabase<br><b id="ss">Checking</b></div><div class="stat">GitHub<br><b id="sg">Checking</b></div></div><div class="toolbar"><input id="path" placeholder="index.html"><button id="read" style="width:auto">Open</button><input id="msg" value="Update from HOA Developer Console"></div><div class="grid"><div class="panel"><h3>Repository Files</h3><div id="files" class="files">Click Repository Files.</div></div><div><div class="panel"><h3>Code Editor</h3><textarea id="code" class="editor" spellcheck="false"></textarea></div><div class="panel" style="margin-top:12px"><h3>Output</h3><div id="out" class="out">Ready.</div></div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://pnzhtiwwqiqnnkecogcc.supabase.co',KEY='sb_publishable_Qwq-5g_j446D3fEyJn5MOg_p9y6JNBC',FN='admin-dev-console',sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);function out(x){$('out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function call(action,extra={}){const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Not authenticated');const{data,error}=await sb.functions.invoke(FN,{body:{action,...extra}});if(error){let m=error.message||'Request failed';try{if(error.context){const j=await error.context.json();m=j.error||m}}catch{}throw Error(m)}if(data?.error)throw Error(data.error);return data}function st(id,v,g=true){$(id).textContent=v;$(id).className=g?'ok':'bad'}async function boot(){const{data:{user}}=await sb.auth.getUser();$('who').textContent=user?.email||'';try{const s=await call('status');st('sa','Connected');st('sd','Authorized');st('ss','Connected');st('sg',s.github_ok?'Connected':'Error',s.github_ok);out(s)}catch(e){st('sa','Connected');st('sd','Unknown',false);st('ss','Connected');st('sg','Error',false);out(e.message)}}async function list(){try{const d=await call('list');$('files').innerHTML=d.files.map(f=>'<div class=file data-p="'+f.path.replaceAll('"','&quot;')+'">'+f.path+'<small>'+Math.round((f.size||0)/1024)+' KB</small></div>').join('');document.querySelectorAll('.file').forEach(x=>x.onclick=()=>{$('path').value=x.dataset.p;read()});out(d)}catch(e){out(e.message)}}async function read(){try{const d=await call('read',{path:$('path').value.trim()});$('code').value=d.content||'';out({ok:true,path:d.path,sha:d.sha})}catch(e){out(e.message)}}async function save(){try{const d=await call('write',{path:$('path').value.trim(),content:$('code').value,message:$('msg').value.trim()});out(d);list()}catch(e){out(e.message)}}async function act(a){try{out(await call(a))}catch(e){out(e.message)}}$('loginBtn').onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error)throw error;$('login').classList.add('hide');$('app').classList.remove('hide');boot();list()}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());$('read').onclick=read;$('save').onclick=save;$('new').onclick=()=>{$('path').value='';$('code').value='';out('Editor cleared.')};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));sb.auth.getSession().then(x=>{if(x.data.session){$('login').classList.add('hide');$('app').classList.remove('hide');boot();list()}});</script></body></html>
