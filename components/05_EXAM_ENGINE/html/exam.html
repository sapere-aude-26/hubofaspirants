<section class="hidden" id="exam">
<div class="examTop">
<div><b>Transportation Engineering</b><div class="sub" id="examMeta"></div></div>
<div style="display:flex;align-items:center;gap:10px">
<button class="secondary hidden" id="adminPreviewExit" onclick="exitAdminPreview()">← BACK TO ADMIN</button>
<div class="timer" id="examTimer">10:00</div>
</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="examGrid">
<div class="card">
<div class="questionNo" id="questionNo"></div>
<div class="question" id="questionText"></div>
<div id="options"></div>
<div class="nav">
<button class="secondary" onclick="prevQ()" type="button">Previous</button>
<button class="primary" onclick="nextQ()" type="button">Next</button>
</div>
</div>
<aside class="card side">
<h3>Questions</h3>
<!-- Question numbers MUST remain above the colour legend. -->
<div class="palette" id="palette"></div>
<div aria-label="Question colour details" class="legend mission-palette-legend">
<div class="legend-item"><span class="legend-dot not-visited"></span><span>Not Visited</span></div>
<div class="legend-item"><span class="legend-dot not-answered"></span><span>Not Answered</span></div>
<div class="legend-item"><span class="legend-dot answered"></span><span>Answered</span></div>
<div class="legend-item"><span class="legend-dot marked"></span><span>Marked for Review</span></div>
<div class="legend-item"><span class="legend-dot marked-answered"></span><span>Answered &amp; Marked</span></div>
</div>
<button class="primary" data-mission-submit="1" id="examSubmitTestButton" style="width:100%;margin-top:18px" type="button">SUBMIT TEST</button>
</aside>
</div>
<div class="ui21-bottom">
<div class="grp">
<button class="review" id="ui21MarkReview" type="button">Mark for Review &amp; Next</button>
<button class="outline" id="ui21Clear" type="button">Clear Response</button>
</div>
<div class="grp">
<button class="outline" id="ui21SaveNext" type="button">Save &amp; Next</button>
<button class="primary" data-mission-submit="1" id="ui21Submit" type="button">Submit Test</button>
</div>
</div>
</section>
